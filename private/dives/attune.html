  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

Bangers', cursive; font-size: clamp(84px, 12vw, 160px); line-height: 0.9; margin: 24px 0 8px; letter-spacing: 0.02em; text-shadow: 5px 5px 0 #c9c9c5;\">ATTUNE<\u002Fh1>\n      <p style=\"position: relative; font-size: 20px; max-width: 620px; margin: 8px 0 28px; font-weight: 500; text-wrap: pretty;\">A focus companion that reads how your work session is going and shifts the soundscape to match — built solo, over 9 weekends.<\u002Fp>\n      <div style=\"position: relative; display: flex; flex-wrap: wrap; gap: 10px; font-family: 'Space Mono', monospace; font-size: 13px;\">\n        <span style=\"border: 2px solid #191919; padding: 5px 12px; box-shadow: 3px 3px 0 #191919; background: #EDEDEA;\">STACK: Next.js + Rust + SQLite<\u002Fspan>\n        <span style=\"border: 2px solid #191919; padding: 5px 12px; box-shadow: 3px 3px 0 #191919; background: #EDEDEA;\">TIMELINE: Jan → Mar 2026<\u002Fspan>\n        <span style=\"border: 2px solid #191919; padding: 5px 12px; box-shadow: 3px 3px 0 #191919; background: #EDEDEA;\">ROLE: everything, unfortunately<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- section nav -->\n  <nav style=\"position: relative; z-index: 1; max-width: 1120px; margin: 28px auto 0; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 10px; font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700;\">\n    <a href=\"#planning\" style=\"text-decoration: none; border: 2px solid #191919; background: #F8F8F6; padding: 7px 16px; box-shadow: 4px 4px 0 #191919;\" style-hover=\"background: #191919; color: #F8F8F6;\">01 PLANNING<\u002Fa>\n    <a href=\"#development\" style=\"text-decoration: none; border: 2px solid #191919; background: #F8F8F6; padding: 7px 16px; box-shadow: 4px 4px 0 #191919;\" style-hover=\"background: #191919; color: #F8F8F6;\">02 DEVELOPMENT<\u002Fa>\n    <a href=\"#features\" style=\"text-decoration: none; border: 2px solid #191919; background: #F8F8F6; padding: 7px 16px; box-shadow: 4px 4px 0 #191919;\" style-hover=\"background: #191919; color: #F8F8F6;\">03 FEATURES<\u002Fa>\n    <a href=\"#lessons\" style=\"text-decoration: none; border: 2px solid #191919; background: #F8F8F6; padding: 7px 16px; box-shadow: 4px 4px 0 #191919;\" style-hover=\"background: #191919; color: #F8F8F6;\">04 LESSONS<\u002Fa>\n    <a href=\"#future\" style=\"text-decoration: none; border: 2px solid #191919; background: #F8F8F6; padding: 7px 16px; box-shadow: 4px 4px 0 #191919;\" style-hover=\"background: #191919; color: #F8F8F6;\">05 FUTURE<\u002Fa>\n  <\u002Fnav>\n\n  <!-- 01 PLANNING -->\n  <section id=\"planning\" data-screen-label=\"01 Planning\" style=\"position: relative; z-index: 1; max-width: 1120px; margin: 72px auto 0; padding: 0 24px;\">\n    <div style=\"display: flex; align-items: center; gap: 18px; margin-bottom: 28px;\">\n      <span style=\"width: 52px; height: 52px; background: #191919; color: #F8F8F6; transform: rotate(45deg); display: flex; align-items: center; justify-content: center; flex: none;\"><b style=\"transform: rotate(-45deg); font-family: 'Bangers', cursive; font-size: 26px;\">01<\u002Fb><\u002Fspan>\n      <h2 style=\"font-family: 'Bangers', cursive; font-size: 56px; margin: 0; letter-spacing: 0.03em;\">PLANNING<\u002Fh2>\n      <span style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #6d6d69; margin-top: 10px;\">/ the brainstorm &amp; the research<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; align-items: start;\">\n      <div style=\"display: grid; gap: 24px;\">\n        <div style=\"position: relative; background: #F8F8F6; border: 3px solid #191919; box-shadow: 7px 7px 0 #191919; padding: 28px 32px;\">\n          <div style=\"position: relative; z-index: 1;\">\n            <div style=\"font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #6d6d69; margin-bottom: 10px;\">THE ITCH<\u002Fdiv>\n            <p style=\"margin: 0; font-size: 19px; font-weight: 500; text-wrap: pretty;\">\"I kept alt-tabbing to change playlists mid-focus. What if the music noticed my typing cadence slowing down and just… handled it?\"<\u002Fp>\n          <\u002Fdiv>\n          <span style=\"position: absolute; bottom: -12px; left: 44px; width: 18px; height: 18px; background: #F8F8F6; border-right: 3px solid #191919; border-bottom: 3px solid #191919; transform: rotate(45deg);\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background: #F8F8F6; border: 3px solid #191919; box-shadow: 7px 7px 0 #191919; padding: 24px 32px;\">\n          <div style=\"font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #6d6d69; margin-bottom: 14px;\">RESEARCH TRAIL<\u002Fdiv>\n          <ul style=\"margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-family: 'Space Mono', monospace; font-size: 14px;\">\n            <li style=\"display: flex; gap: 10px;\"><b>→<\u002Fb> Keystroke-dynamics papers: cadence variance ≈ decent focus proxy<\u002Fli>\n            <li style=\"display: flex; gap: 10px;\"><b>→<\u002Fb> brain.fm / Endel teardowns — what \"adaptive audio\" actually ships<\u002Fli>\n            <li style=\"display: flex; gap: 10px;\"><b>→<\u002Fb> Web Audio API crossfade limits (spoiler: fine up to 4 stems)<\u002Fli>\n            <li style=\"display: flex; gap: 10px;\"><b>→<\u002Fb> 11 user interviews — everyone lies about their focus habits<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; gap: 20px;\">\n        <div style=\"background: #EDEDEA; border: 3px solid #191919; box-shadow: 7px 7px 0 #191919; padding: 20px 24px; transform: rotate(1.2deg);\">\n          <div style=\"font-family: 'Bangers', cursive; font-size: 22px; letter-spacing: 0.04em;\">BRAIN DUMP #1<\u002Fdiv>\n          <p style=\"margin: 6px 0 0; font-size: 15px;\">Detect flow from keyboard + app switches. NO webcam. Nobody wants a webcam focus app.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #EDEDEA; border: 3px solid #191919; box-shadow: 7px 7px 0 #191919; padding: 20px 24px; transform: rotate(-1.4deg);\">\n          <div style=\"font-family: 'Bangers', cursive; font-size: 22px; letter-spacing: 0.04em;\">BRAIN DUMP #2<\u002Fdiv>\n          <p style=\"margin: 6px 0 0; font-size: 15px;\">Stems, not tracks. Layer in/out intensity instead of skipping songs — no jarring cuts.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #191919; color: #F8F8F6; border: 3px solid #191919; box-shadow: 7px 7px 0 #8a8a86; padding: 20px 24px; transform: rotate(0.8deg);\">\n          <div style=\"font-family: 'Bangers', cursive; font-size: 22px; letter-spacing: 0.04em;\">CONSTRAINTS<\u002Fdiv>\n          <ul style=\"margin: 8px 0 0; padding-left: 18px; font-size: 15px; display: grid; gap: 4px;\">\n            <li>Local-first. Telemetry never leaves the machine.<\u002Fli>\n            <li>&lt; 2% CPU while listening.<\u002Fli>\n            <li>Ship in a quarter or kill it.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 02 DEVELOPMENT -->\n  <section id=\"development\" data-screen-label=\"02 Development\" style=\"position: relative; z-index: 1; max-width: 1120px; margin: 88px auto 0; padding: 0 24px;\">\n    <div style=\"display: flex; align-items: center; gap: 18px; margin-bottom: 28px;\">\n      <span style=\"width: 52px; height: 52px; background: #191919; color: #F8F8F6; transform: rotate(45deg); display: flex; align-items: center; justify-content: center; flex: none;\"><b style=\"transform: rotate(-45deg); font-family: 'Bangers', cursive; font-size: 26px;\">02<\u002Fb><\u002Fspan>\n      <h2 style=\"font-family: 'Bangers', cursive; font-size: 56px; margin: 0; letter-spacing: 0.03em;\">DEVELOPMENT<\u002Fh2>\n      <span style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #6d6d69; margin-top: 10px;\">/ the stack, the plumbing, the fights<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start;\">\n      <div style=\"background: #F8F8F6; border: 3px solid #191919; box-shadow: 7px 7px 0 #191919;\">\n        <div style=\"border-bottom: 3px solid #191919; padding: 12px 20px; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; background: #EDEDEA;\">THE STACK, LAYER BY LAYER<\u002Fdiv>\n        <div style=\"display: grid;\">\n          <div style=\"display: grid; grid-template-columns: 96px 130px 1fr; gap: 14px; padding: 14px 20px; border-bottom: 2px dashed #c9c9c5; font-size: 15px;\"><b style=\"font-family: 'Space Mono', monospace; font-size: 12px; color: #6d6d69; padding-top: 2px;\">UI<\u002Fb><b>Next.js 15<\u002Fb><span>App shell + settings. Overkill? Yes. Familiar? Also yes.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 96px 130px 1fr; gap: 14px; padding: 14px 20px; border-bottom: 2px dashed #c9c9c5; font-size: 15px;\"><b style=\"font-family: 'Space Mono', monospace; font-size: 12px; color: #6d6d69; padding-top: 2px;\">SIGNAL<\u002Fb><b>Rust daemon<\u002Fb><span>Keystroke cadence + window-switch sampling at 4Hz, ~0.6% CPU.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 96px 130px 1fr; gap: 14px; padding: 14px 20px; border-bottom: 2px dashed #c9c9c5; font-size: 15px;\"><b style=\"font-family: 'Space Mono', monospace; font-size: 12px; color: #6d6d69; padding-top: 2px;\">AUDIO<\u002Fb><b>Web Audio<\u002Fb><span>4 stem buses, equal-power crossfades driven by the focus score.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 96px 130px 1fr; gap: 14px; padding: 14px 20px; font-size: 15px;\"><b style=\"font-family: 'Space Mono', monospace; font-size: 12px; color: #6d6d69; padding-top: 2px;\">DATA<\u002Fb><b>SQLite<\u002Fb><span>One file. Sessions, scores, zero servers, zero regrets.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; gap: 24px;\">\n        <div style=\"background: #191919; color: #d8d8d4; border: 3px solid #191919; box-shadow: 7px 7px 0 #8a8a86;\">\n          <div style=\"display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 2px solid #3a3a38; font-family: 'Space Mono', monospace; font-size: 12px; color: #8a8a86;\">\n            <span style=\"width: 9px; height: 9px; border-radius: 50%; background: #55555299;\"><\u002Fspan>\n            <span style=\"width: 9px; height: 9px; border-radius: 50%; background: #55555299;\"><\u002Fspan>\n            <span style=\"width: 9px; height: 9px; border-radius: 50%; background: #55555299;\"><\u002Fspan>\n            <span style=\"margin-left: 8px;\">attune/pipeline.txt<\u002Fspan>\n          <\u002Fdiv>\n          <pre style=\"margin: 0; padding: 18px 20px; font-family: 'Space Mono', monospace; font-size: 13px; line-height: 1.7; overflow-x: auto;\">keystrokes ──┐\napp focus ───┼─▶ [rust daemon] ─▶ focus score (0..1)\nidle gaps ───┘         │\n                       ▼\n              [mixer: 4 stem buses]\n   ambient ▂▂  pads ▂▄  rhythm ▄▆  texture ▂▂\n                       │\n                       ▼\n                 your headphones<\u002Fpre>\n        <\u002Fdiv>\n        <div style=\"background: #F8F8F6; border: 3px solid #191919; box-shadow: 7px 7px 0 #191919; padding: 20px 24px;\">\n          <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 8px;\">\n            <span style=\"font-family: 'Bangers', cursive; font-size: 24px; background: #191919; color: #F8F8F6; padding: 2px 12px; transform: rotate(-2deg);\">DECISION!<\u002Fspan>\n            <b style=\"font-size: 16px;\">Rust daemon over Electron listener<\u002Fb>\n          <\u002Fdiv>\n          <p style=\"margin: 0; font-size: 15px; text-wrap: pretty;\">The whole pitch dies if Attune is the thing slowing your machine down. The daemon idles at 14MB; the Electron prototype idled at 210MB. Not close.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #F8F8F6; border: 3px solid #191919; box-shadow: 7px 7px 0 #191919; padding: 20px 24px;\">\n          <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 8px;\">\n            <span style=\"font-family: 'Bangers', cursive; font-size: 24px; background: #191919; color: #F8F8F6; padding: 2px 12px; transform: rotate(1.5deg);\">DECISION!<\u002Fspan>\n            <b style=\"font-size: 16px;\">Heuristics over ML for the focus score<\u002Fb>\n          <\u002Fdiv>\n          <p style=\"margin: 0; font-size: 15px; text-wrap: pretty;\">A 40-line EWMA over cadence variance beat the trained model on my own sessions. Deleted the model. Felt great.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 03 FEATURES -->\n  <section id=\"features\" data-screen-label=\"03 Features\" style=\"position: relative; z-index: 1; max-width: 1120px; margin: 88px auto 0; padding: 0 24px;\">\n    <div style=\"display: flex; align-items: center; gap: 18px; margin-bottom: 28px;\">\n      <span style=\"width: 52px; height: 52px; background: #191919; color: #F8F8F6; transform: rotate(45deg); display: flex; align-items: center; justify-content: center; flex: none;\"><b style=\"transform: rotate(-45deg); font-family: 'Bangers', cursive; font-size: 26px;\">03<\u002Fb><\u002Fspan>\n      <h2 style=\"font-family: 'Bangers', cursive; font-size: 56px; margin: 0; letter-spacing: 0.03em;\">FEATURES<\u002Fh2>\n      <span style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #6d6d69; margin-top: 10px;\">/ what actually shipped<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;\">\n      <div style=\"grid-column: span 2; background: #F8F8F6; border: 3px solid #191919; box-shadow: 7px 7px 0 #191919;\">\n        <div style=\"height: 300px; border-bottom: 3px solid #191919;\">\n          <image-slot id=\"feat-mixer\" shape=\"rect\" placeholder=\"Drop screenshot: live mixer view\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div style=\"padding: 20px 24px;\">\n          <div style=\"display: flex; align-items: baseline; gap: 12px;\">\n            <span style=\"font-family: 'Bangers', cursive; font-size: 30px;\">THE LIVE MIXER<\u002Fspan>\n            <span style=\"font-family: 'Space Mono', monospace; font-size: 12px; color: #6d6d69;\">feat/01<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin: 6px 0 0; font-size: 15px; text-wrap: pretty;\">Four stems breathe with your focus score in real time. Deep in flow → rhythm layer swells. Doomscrolling → everything thins out to ambient, passive-aggressively.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #F8F8F6; border: 3px solid #191919; box-shadow: 7px 7px 0 #191919;\">\n        <div style=\"height: 300px; border-bottom: 3px solid #191919;\">\n          <image-slot id=\"feat-sessions\" shape=\"rect\" placeholder=\"Drop screenshot: session recap\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div style=\"padding: 20px 24px;\">\n          <div style=\"display: flex; align-items: baseline; gap: 12px;\">\n            <span style=\"font-family: 'Bangers', cursive; font-size: 30px;\">SESSION RECAPS<\u002Fspan>\n            <span style=\"font-family: 'Space Mono', monospace; font-size: 12px; color: #6d6d69;\">feat/02<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin: 6px 0 0; font-size: 15px; text-wrap: pretty;\">A focus-score sparkline per session, annotated with what knocked you out of flow.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #F8F8F6; border: 3px solid #191919; box-shadow: 7px 7px 0 #191919;\">\n        <div style=\"height: 240px; border-bottom: 3px solid #191919;\">\n          <image-slot id=\"feat-panic\" shape=\"rect\" placeholder=\"Drop screenshot: panic fade\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div style=\"padding: 20px 24px;\">\n          <div style=\"display: flex; align-items: baseline; gap: 12px;\">\n            <span style=\"font-family: 'Bangers', cursive; font-size: 30px;\">PANIC FADE<\u002Fspan>\n            <span style=\"font-family: 'Space Mono', monospace; font-size: 12px; color: #6d6d69;\">feat/03<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin: 6px 0 0; font-size: 15px; text-wrap: pretty;\">Double-tap ⌥ and everything ducks to silence in 300ms. For when someone walks up to your desk.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"grid-column: span 2; background: #F8F8F6; border: 3px solid #191919; box-shadow: 7px 7px 0 #191919;\">\n        <div style=\"height: 240px; border-bottom: 3px solid #191919;\">\n          <image-slot id=\"feat-privacy\" shape=\"rect\" placeholder=\"Drop screenshot: local-only data view\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div style=\"padding: 20px 24px;\">\n          <div style=\"display: flex; align-items: baseline; gap: 12px;\">\n            <span style=\"font-family: 'Bangers', cursive; font-size: 30px;\">LOCAL-ONLY LEDGER<\u002Fspan>\n            <span style=\"font-family: 'Space Mono', monospace; font-size: 12px; color: #6d6d69;\">feat/04<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin: 6px 0 0; font-size: 15px; text-wrap: pretty;\">Every sample lives in one SQLite file you can open, inspect, and delete. There is no cloud. The README says so in bold, twice.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 04 LESSONS -->\n  <section id=\"lessons\" data-screen-label=\"04 Lessons Learned\" style=\"position: relative; z-index: 1; max-width: 1120px; margin: 88px auto 0; padding: 0 24px;\">\n    <div style=\"display: flex; align-items: center; gap: 18px; margin-bottom: 28px;\">\n      <span style=\"width: 52px; height: 52px; background: #191919; color: #F8F8F6; transform: rotate(45deg); display: flex; align-items: center; justify-content: center; flex: none;\"><b style=\"transform: rotate(-45deg); font-family: 'Bangers', cursive; font-size: 26px;\">04<\u002Fb><\u002Fspan>\n      <h2 style=\"font-family: 'Bangers', cursive; font-size: 56px; margin: 0; letter-spacing: 0.03em;\">LESSONS LEARNED<\u002Fh2>\n      <span style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #6d6d69; margin-top: 10px;\">/ scars, itemized<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; gap: 20px;\">\n      <div style=\"display: grid; grid-template-columns: 90px 1fr; gap: 20px; background: #F8F8F6; border: 3px solid #191919; box-shadow: 7px 7px 0 #191919; padding: 24px 28px; align-items: start;\">\n        <span style=\"font-family: 'Bangers', cursive; font-size: 64px; line-height: 1; text-shadow: 3px 3px 0 #c9c9c5;\">#1<\u002Fspan>\n        <div>\n          <b style=\"font-size: 18px;\">Build the boring detector first.<\u002Fb>\n          <p style=\"margin: 6px 0 0; font-size: 15px; text-wrap: pretty;\">I spent 3 weekends on audio crossfades before the focus score existed. Demos with fake data feel like progress. They are not progress.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 90px 1fr; gap: 20px; background: #F8F8F6; border: 3px solid #191919; box-shadow: 7px 7px 0 #191919; padding: 24px 28px; align-items: start;\">\n        <span style=\"font-family: 'Bangers', cursive; font-size: 64px; line-height: 1; text-shadow: 3px 3px 0 #c9c9c5;\">#2<\u002Fspan>\n        <div>\n          <b style=\"font-size: 18px;\">Adaptive ≠ noticeable.<\u002Fb>\n          <p style=\"margin: 6px 0 0; font-size: 15px; text-wrap: pretty;\">v1 changed the mix every 10 seconds and users hated it. The final build waits 90s before reacting. The best feature updates are the ones nobody catches happening.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position: relative; display: grid; grid-template-columns: 90px 1fr; gap: 20px; background: #191919; color: #F8F8F6; border: 3px solid #191919; box-shadow: 7px 7px 0 #8a8a86; padding: 24px 28px; align-items: start;\">\n        <span style=\"font-family: 'Bangers', cursive; font-size: 64px; line-height: 1; color: #F8F8F6;\">#3<\u002Fspan>\n        <div>\n          <b style=\"font-size: 18px;\">Licensing stems is a nightmare.<\u002Fb>\n          <p style=\"margin: 6px 0 0; font-size: 15px; color: #d8d8d4; text-wrap: pretty;\">Two weeks of emails to license 12 tracks as stems. Ended up commissioning a friend for an original pack instead — cheaper, faster, and it slaps.<\u002Fp>\n        <\u002Fdiv>\n        <span style=\"position: absolute; top: -14px; right: 24px; font-family: 'Bangers', cursive; font-size: 22px; background: #F8F8F6; color: #191919; border: 3px solid #191919; padding: 2px 14px; transform: rotate(3deg); letter-spacing: 0.06em;\">OOF.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 05 FUTURE -->\n  <section id=\"future\" data-screen-label=\"05 Future\" style=\"position: relative; z-index: 1; max-width: 1120px; margin: 88px auto 0; padding: 0 24px 96px;\">\n    <div style=\"display: flex; align-items: center; gap: 18px; margin-bottom: 28px;\">\n      <span style=\"width: 52px; height: 52px; background: #191919; color: #F8F8F6; transform: rotate(45deg); display: flex; align-items: center; justify-content: center; flex: none;\"><b style=\"transform: rotate(-45deg); font-family: 'Bangers', cursive; font-size: 26px;\">05<\u002Fb><\u002Fspan>\n      <h2 style=\"font-family: 'Bangers', cursive; font-size: 56px; margin: 0; letter-spacing: 0.03em;\">FUTURE<\u002Fh2>\n      <span style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #6d6d69; margin-top: 10px;\">/ the roadmap, loosely held<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; align-items: start;\">\n      <div style=\"background: #F8F8F6; border: 3px solid #191919; box-shadow: 7px 7px 0 #191919; padding: 24px 28px;\">\n        <div style=\"display: flex; justify-content: space-between; align-items: baseline; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #6d6d69; margin-bottom: 12px;\">\n          <span>V1.1 — IN FLIGHT<\u002Fspan><span>{{ progressPct }} done<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height: 18px; border: 2px solid #191919; background: #EDEDEA; margin-bottom: 20px;\">\n          <div style=\"height: 100%; background: repeating-linear-gradient(-45deg, #191919 0 6px, #4a4a47 6px 12px); width: {{ progressW }};\"><\u002Fdiv>\n        <\u002Fdiv>\n        <ul style=\"margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; font-size: 15px;\">\n          <li style=\"display: flex; gap: 12px; align-items: baseline;\"><span style=\"width: 16px; height: 16px; border: 2px solid #191919; background: #191919; flex: none; transform: translateY(2px);\"><\u002Fspan><span style=\"text-decoration: line-through; color: #8a8a86;\">Menu-bar-only mode (kill the window)<\u002Fspan><\u002Fli>\n          <li style=\"display: flex; gap: 12px; align-items: baseline;\"><span style=\"width: 16px; height: 16px; border: 2px solid #191919; flex: none; transform: translateY(2px);\"><\u002Fspan>Calendar awareness — pre-duck before meetings start<\u002Fli>\n          <li style=\"display: flex; gap: 12px; align-items: baseline;\"><span style=\"width: 16px; height: 16px; border: 2px solid #191919; flex: none; transform: translateY(2px);\"><\u002Fspan>Bring-your-own-stems importer (drag a folder, get a scene)<\u002Fli>\n          <li style=\"display: flex; gap: 12px; align-items: baseline;\"><span style=\"width: 16px; height: 16px; border: 2px solid #191919; flex: none; transform: translateY(2px);\"><\u002Fspan>Windows daemon port — the Rust part is 90% there already<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"border: 3px dashed #191919; padding: 24px 28px; background: transparent;\">\n        <div style=\"font-family: 'Bangers', cursive; font-size: 26px; letter-spacing: 0.04em; margin-bottom: 10px;\">V2 WISHLIST *<\u002Fdiv>\n        <ul style=\"margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 15px; color: #4a4a47;\">\n          <li>Shared \"focus rooms\" — same soundscape, synced with a friend<\u002Fli>\n          <li>Score API so other tools can react to your focus state<\u002Fli>\n          <li>Hardware knob. No reason. I just want a knob.<\u002Fli>\n        <\u002Ful>\n        <p style=\"margin: 16px 0 0; font-family: 'Space Mono', monospace; font-size: 12px; color: #8a8a86;\">* contingent on v1.1 not breaking me<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- footer -->\n  <footer style=\"position: relative; z-index: 1; background: #191919; color: #b5b5b0; font-family: 'Space Mono', monospace; font-size: 13px;\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 22px 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;\">\n      <a href=\"#\" style=\"color: #F8F8F6; text-decoration: none; border-bottom: 2px solid #F8F8F6;\">← back to avinasdashin.com<\u002Fa>\n      <span>proj-dive-48213 · {{ statusLabel }} · access code redacted, obviously<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;status&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;SHIPPED&quot;, &quot;options&quot;: [&quot;WIP&quot;, &quot;SHIPPED&quot;, &quot;ARCHIVED&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Project&quot;},\n  &quot;roadmapProgress&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 25, &quot;min&quot;: 0, &quot;max&quot;: 100, &quot;step&quot;: 5, &quot;unit&quot;: &quot;%&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Project&quot;},\n  &quot;halftone&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Style&quot;},\n  &quot;grain&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Style&quot;}\n}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const status = this.props.status ?? \"SHIPPED\";\n    const labels = { WIP: \"WORK IN PROGRESS\", SHIPPED: \"SHIPPED IT\", ARCHIVED: \"ON ICE\" };\n    const p = Math.max(0, Math.min(100, this.props.roadmapProgress ?? 25));\n    return {\n      halftone: this.props.halftone ?? true,\n      grain: this.props.grain ?? true,\n      statusLabel: labels[status] || status,\n      progressPct: p + \"%\",\n      progressW: p + \"%\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
